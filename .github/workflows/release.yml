# 태그(vX.Y.Z)를 올리면 설치 파일을 빌드해 GitHub Releases 에 올린다.
# 앱은 시작할 때 최신 릴리스를 확인해 자동 업데이트를 안내한다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 태그와 version.py 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import sys; sys.path.insert(0,'src'); from dongwon_check.version import __version__; print(__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "태그 ${{ github.ref_name }} 와 version.py ($v) 가 다릅니다" }

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: 빌드(테스트 포함)
        shell: pwsh
        run: ./packaging/build.ps1

      - name: 릴리스에 설치 파일 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DongwonCheck-Setup-*.exe
          body_path: build/release_notes.md
